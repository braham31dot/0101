        function initTheme() {
            const savedTheme = localStorage.getItem('remedy-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme || (prefersDark ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', theme);

            const savedColor = localStorage.getItem('remedy-color') || 'emerald';
            currentColor = savedColor;
            document.documentElement.setAttribute('data-color', savedColor);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('remedy-theme', newTheme);
            renderApp();
        }

        function changeColor(color) {
            currentColor = color;
            document.documentElement.setAttribute('data-color', color);
            localStorage.setItem('remedy-color', color);
            appState.colorMenuOpen = false;
            renderApp();
        }

        function changeLanguage(lang) {
            currentLanguage = translations[lang] ? lang : 'en';
            localStorage.setItem('remedy-language', currentLanguage);
            appState.langMenuOpen = false;
            applyLocaleSettings();
            renderApp();
        }

        function formatText(template, values = {}) {
            return template.replace(/\{(\w+)\}/g, (_, key) => values[key] ?? '');
        }

        function t(key, values) {
            const template = translations[currentLanguage]?.[key] || translations['en']?.[key] || key;
            return values ? formatText(template, values) : template;
        }

        function renderMessageContent(msg) {
            if (msg.type === 'welcome') {
                return t('botWelcome');
            }

            if (msg.type === 'selection') {
                return t('guidanceFor', {
                    tradition: getTraditionLabel(msg.tradition),
                    concern: getConcernLabel(msg.concern)
                });
            }

            if (msg.type === 'remedy') {
                return getRemedyContent(msg.tradition, msg.concern);
            }

            return msg.content || '';
        }

        function applyLocaleSettings() {
            document.documentElement.lang = currentLanguage;
            document.documentElement.dir = RTL_LANGS.has(currentLanguage) ? 'rtl' : 'ltr';
            document.title = `${t('welcomeTitle')} - ${t('welcomeSubtitle')}`;

            const metaDescription = document.querySelector('meta[name="description"]');
            if (metaDescription) {
                metaDescription.setAttribute('content', t('metaDescription'));
            }

            const appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
            if (appleTitle) {
                appleTitle.setAttribute('content', t('welcomeTitle'));
            }
        }

        function setAppHeight() {
            const viewportHeight = window.visualViewport
                ? window.visualViewport.height
                : document.documentElement.clientHeight || window.innerHeight;
            document.documentElement.style.setProperty('--app-height', `${Math.round(viewportHeight)}px`);
        }

        let viewportUpdateFrame = null;
        function queueViewportUpdate() {
            if (viewportUpdateFrame) {
                cancelAnimationFrame(viewportUpdateFrame);
            }

            viewportUpdateFrame = requestAnimationFrame(() => {
                setAppHeight();
                window.scrollTo(0, 0);
                viewportUpdateFrame = null;
            });
        }

        function getTranslatedRemedy(lang, tradition, concern) {
            const concernTranslation = remediesTranslations[lang]?.[concern];

            if (typeof concernTranslation === 'string') {
                return concernTranslation;
            }

            if (concernTranslation && typeof concernTranslation === 'object') {
                return concernTranslation[tradition] || concernTranslation.default || concernTranslation.all || null;
            }

            return null;
        }

        function getRemedyContent(tradition, concern) {
            let advice = getTranslatedRemedy(currentLanguage, tradition, concern) || remedies[tradition]?.[concern];
            
            if (!advice) {
                return t('generalFallbackAdvice');
            }

            if (concern === 'STD') {
                return advice;
            }

            return `${advice}

${t('safetyWarning')}`;
        }

        window.addEventListener('resize', queueViewportUpdate);
        window.addEventListener('orientationchange', queueViewportUpdate);
        window.addEventListener('pageshow', queueViewportUpdate);

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', queueViewportUpdate);
            window.visualViewport.addEventListener('scroll', queueViewportUpdate);
        }

        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        function formatDefaultConcernLabel(concern) {
            if (concern === 'STD') return 'STD';
            return concern.replace(/\b\w/g, (char) => char.toUpperCase());
        }

        function getTraditionLabel(tradition, lang = currentLanguage) {
            return TRADITION_LABELS[lang]?.[tradition] || tradition;
        }

        function getConcernLabel(concern, lang = currentLanguage) {
            return CONCERN_LABELS[lang]?.[concern] || formatDefaultConcernLabel(concern);
        }

        function getColorLabel(color, lang = currentLanguage) {
            const colorKey = `color${color.charAt(0).toUpperCase()}${color.slice(1)}`;
            return translations[lang]?.[colorKey] || translations.en?.[colorKey] || color;
        }

        // ============================================
        // APP STATE MANAGEMENT
        // ============================================

        let appState = {
            loading: true,
            tradition: "",
            concern: "",
            messages: [],
            isTyping: false,
            langMenuOpen: false,
            colorMenuOpen: false
        };

        // ============================================
        // RENDERING FUNCTIONS
        // ============================================

        function goToChat() {
            currentPage = 'chat';
            appState.loading = false;
            appState.messages = [
                {
                    id: "init",
                    role: "bot",
                    type: "welcome"
                }
            ];
            renderApp();
        }

        function goToAbout() {
            currentPage = 'about';
            renderApp();
        }

        function goToPrivacy() {
            currentPage = 'privacy';
            renderApp();
        }

        function goToWelcome() {
            currentPage = 'welcome';
            appState.messages = [];
            appState.tradition = "";
            appState.concern = "";
            appState.isTyping = false;
            renderApp();
        }

        function toggleLangMenu() {
            appState.langMenuOpen = !appState.langMenuOpen;
            appState.colorMenuOpen = false;
            renderApp();
        }

        function toggleColorMenu() {
            appState.colorMenuOpen = !appState.colorMenuOpen;
            appState.langMenuOpen = false;
            renderApp();
        }

        function renderApp() {
            const root = document.getElementById("root");
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const themeIcon = currentTheme === 'light' ? '🌙' : '☀️';
            applyLocaleSettings();
            
            if (currentPage === 'welcome') {
                root.innerHTML = `
                    <div class="welcome-screen">
                        <div class="welcome-logo">🌿</div>
                        <h1 class="welcome-title">${t('welcomeTitle')}</h1>
                        <p class="welcome-subtitle">${t('welcomeSubtitle')}</p>

                        <div class="welcome-content-wrapper">
                            <div class="welcome-section">
                                <h3>${t('fourTraditions')}</h3>
                                <p>${t('fourTraditionsDesc')}</p>
                            </div>
                            
                            <div class="welcome-section">
                                <h3>${t('learningTool')}</h3>
                                <p>${t('learningToolDesc')}</p>
                            </div>

                            <div class="welcome-section">
                                <h3>${t('notMedicalAdvice')}</h3>
                                <p>${t('notMedicalAdviceDesc')}</p>
                            </div>
                        </div>

                        <div class="welcome-buttons">
                            <button class="welcome-btn" onclick="window.goToAbout()">${t('aboutBtn')}</button>
                            <button class="welcome-btn" onclick="window.goToPrivacy()">${t('privacyBtn')}</button>
                        </div>

                        <button class="welcome-main-btn" onclick="window.goToChat()">
                            ${t('getStarted')}
                        </button>
                    </div>
                `;
                return;
            }

            if (currentPage === 'about') {
                root.innerHTML = `
                    <div class="info-page">
                        <div class="info-header">
                            <h1>${t('aboutTitle')}</h1>
                            <button class="back-btn" onclick="window.goToWelcome()" title="${t('backTitle')}">←</button>
                        </div>
                        <div class="info-content scrollable">
                            <h2>${t('aboutTitle')}</h2>
                            <p>${t('aboutText')}</p>

                            <h2>${t('mission')}</h2>
                            <p>${t('missionText')}</p>

                            <h2>${t('whatWeOffer')}</h2>
                            <ul>
                                <li>${t('offer1')}</li>
                                <li>${t('offer2')}</li>
                                <li>${t('offer3')}</li>
                                <li>${t('offer4')}</li>
                                <li>${t('offer5')}</li>
                                <li>${t('offer6')}</li>
                            </ul>

                            <h2>${t('disclaimer')}</h2>
                            <p>${t('disclaimerText')}</p>

                            <p>${t('disclaimerText2')}</p>

                            <h2>${t('safetyFirst')}</h2>
                            <p>${t('safetyFirstText')}</p>

                            <h2>${t('development')}</h2>
                            <p>${t('developmentText')}</p>
                        </div>
                    </div>
                `;
                return;
            }

            if (currentPage === 'privacy') {
                root.innerHTML = `
                    <div class="info-page">
                        <div class="info-header">
                            <h1>${t('privacyTitle')}</h1>
                            <button class="back-btn" onclick="window.goToWelcome()" title="${t('backTitle')}">←</button>
                        </div>
                        <div class="info-content scrollable">
                            <h2>${t('privacyTitle')}</h2>
                            <p><strong>${t('lastUpdated')}</strong> ${new Date().getFullYear()}</p>

                            <h2>${t('dataCollection')}</h2>
                            <p>${t('dataCollectionText')}</p>

                            <h2>${t('noAnalytics')}</h2>
                            <p>${t('noAnalyticsText')}</p>

                            <h2>${t('noThirdParty')}</h2>
                            <p>${t('noThirdPartyText')}</p>

                            <h2>${t('offlineFirst')}</h2>
                            <p>${t('offlineFirstText')}</p>

                            <h2>${t('localStorage')}</h2>
                            <p>${t('localStorageText')}</p>

                            <h2>${t('security')}</h2>
                            <p>${t('securityText')}</p>

                            <h2>${t('privacyChanges')}</h2>
                            <p>${t('privacyChangesText')}</p>

                            <h2>${t('contact')}</h2>
                            <p>${t('contactText')}</p>

                            <h2>${t('yourRights')}</h2>
                            <p>${t('yourRightsText')}</p>
                        </div>
                    </div>
                `;
                return;
            }

            // CHAT PAGE
            if (appState.loading) {
                root.innerHTML = `
                    <div class="loading-screen">
                        <div class="loading-spinner"></div>
                        <p class="loading-text">${t('loading')}</p>
                        <p class="loading-subtext">${t('loadingSubtext')}</p>
                    </div>
                `;
                return;
            }
            
            root.innerHTML = `
                <div class="chat-container">
                    <div class="chat-header">
                        <div class="header-left">
                            <button class="return-btn" onclick="window.goToWelcome()" title="${t('returnToWelcomeTitle')}">
                                ⌂
                            </button>
                        </div>
                        
                        <div class="header-content">
                            <h1>🌿 ${t('welcomeTitle')}</h1>
                            <p>${t('welcomeSubtitle')}</p>
                        </div>
                        
                        <div class="header-buttons">
                            <div class="lang-menu">
                                <button class="lang-btn" onclick="window.toggleLangMenu()" title="${t('changeLanguageTitle')}">
                                    ${currentLanguage.toUpperCase()}
                                </button>
                                <div class="lang-dropdown ${appState.langMenuOpen ? 'active' : ''}">
                                    ${LANGUAGE_OPTIONS.map(({ code, label }) => `
                                        <button class="lang-option ${currentLanguage === code ? 'selected' : ''}" onclick="window.changeLanguage('${code}')">${label}</button>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="color-menu">
                                <button class="color-btn" onclick="window.toggleColorMenu()" title="${t('changeColorTitle')}">
                                    🎨
                                </button>
                                <div class="color-dropdown ${appState.colorMenuOpen ? 'active' : ''}">
                                    ${COLOR_OPTIONS.map((color) => `
                                        <button class="color-option ${currentColor === color ? 'selected' : ''}" onclick="window.changeColor('${color}')"><span class="color-dot ${color}"></span>${getColorLabel(color)}</button>
                                    `).join('')}
                                </div>
                            </div>

                            <button class="theme-toggle" onclick="window.toggleTheme()" title="${t('toggleThemeTitle')}">
                                ${themeIcon}
                            </button>
                        </div>
                    </div>
                    
                    <div class="chat-messages scrollable" id="messagesContainer">
                        ${appState.messages.map((msg, idx) => `
                            <div class="message ${msg.role}">
                                <div class="message-content ${msg.isWarning ? 'warning' : ''}">
                                    ${escapeHtml(renderMessageContent(msg))}
                                </div>
                            </div>
                        `).join('')}
                        ${appState.isTyping ? `
                            <div class="message bot">
                                <div class="typing-indicator">
                                    <div class="typing-dot"></div>
                                    <div class="typing-dot"></div>
                                    <div class="typing-dot"></div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                    
                    <div class="chat-form-wrapper">
                        <div class="chat-form">
                            <form id="remedyForm" onsubmit="handleSubmit(event)">
                                <div class="form-wrapper">
                                    <div class="form-inputs">
                                        <div class="form-group">
                                            <label for="tradition">${t('tradition')} <span class="required-indicator">*</span></label>
                                            <select id="tradition" required>
                                                <option value="">${t('choose')}</option>
                                                ${TRADITIONS.map((tradition) => `<option value="${tradition}" ${appState.tradition === tradition ? 'selected' : ''}>${getTraditionLabel(tradition)}</option>`).join('')}
                                            </select>
                                        </div>
                                        
                                        <div class="form-group">
                                            <label for="concern">${t('concern')} <span class="required-indicator">*</span></label>
                                            <select id="concern" required>
                                                <option value="">${t('choose')}</option>
                                                ${CONCERNS.map((concern) => `<option value="${concern}" ${appState.concern === concern ? 'selected' : ''}>${getConcernLabel(concern)}</option>`).join('')}
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div class="send-btn-wrapper">
                                        <button type="submit" class="send-btn" ${appState.isTyping ? 'disabled' : ''}>
                                            ${appState.isTyping ? '⏳' : '📨'}
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            `;
            
            setTimeout(() => {
                const container = document.getElementById("messagesContainer");
                if (container) {
                    container.scrollTop = container.scrollHeight;
                }
            }, 0);
            
            const traditionalSelect = document.getElementById("tradition");
            const concernSelect = document.getElementById("concern");
            
            if (traditionalSelect) {
                traditionalSelect.addEventListener("change", (e) => {
                    appState.tradition = e.target.value;
                });
            }
            
            if (concernSelect) {
                concernSelect.addEventListener("change", (e) => {
                    appState.concern = e.target.value;
                });
            }
        }

        function handleSubmit(e) {
            e.preventDefault();
            
            if (!appState.tradition || !appState.concern) {
                alert(t('selectBothAlert'));
                return;
            }

            const selectedTradition = appState.tradition;
            const selectedConcern = appState.concern;
            
            const userMsg = {
                id: Date.now().toString(),
                role: "user",
                type: "selection",
                tradition: selectedTradition,
                concern: selectedConcern
            };
            
            appState.messages.push(userMsg);
            appState.isTyping = true;
            renderApp();
            
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
            
            setTimeout(() => {
                const botMsg = {
                    id: (Date.now() + 1).toString(),
                    role: "bot",
                    type: "remedy",
                    tradition: selectedTradition,
                    concern: selectedConcern,
                    isWarning: selectedConcern === "STD"
                };
                
                appState.messages.push(botMsg);
                appState.isTyping = false;
                appState.tradition = "";
                appState.concern = "";
                renderApp();
            }, 1500);
        }

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // APP INITIALIZATION
        // ============================================

        window.addEventListener("DOMContentLoaded", () => {
            const savedLang = localStorage.getItem('remedy-language');
            if (savedLang && translations[savedLang]) {
                currentLanguage = savedLang;
            }
            initTheme();
            applyLocaleSettings();
            queueViewportUpdate();
            renderApp();
        });

        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
            if (!localStorage.getItem('remedy-theme')) {
                document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
                renderApp();
            }
        });

        // Expose functions globally
        window.toggleTheme = toggleTheme;
        window.changeColor = changeColor;
        window.changeLanguage = changeLanguage;
        window.toggleLangMenu = toggleLangMenu;
        window.toggleColorMenu = toggleColorMenu;
        window.handleSubmit = handleSubmit;
        window.goToChat = goToChat;
        window.goToAbout = goToAbout;
        window.goToPrivacy = goToPrivacy;
        window.goToWelcome = goToWelcome;
    </script>
</body>
</html>
